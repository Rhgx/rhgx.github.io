<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocks's Websites</title>
  <meta content="Rocks's Websites" property="og:title" />
  <meta content="A collection of websites made by me (Rocks)" property="og:description" />
  <meta content="https://rhgx.github.io/" property="og:url" />
  <meta content="https://avatars.githubusercontent.com/u/49099959?v=4&size=256" property="og:image" />
  <meta content="#f0522b" data-react-helmet="true" name="theme-color" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Oswald', sans-serif;
      background-color: #252525;
      display: flex;
      color: aliceblue;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            background-image: repeating-linear-gradient(45deg, #1b1b1b 0, #1b1b1b 5px, transparent 0, transparent 50%);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: -1;
        }
        
    .container {
      background-color: #494949;
      border-radius: 10px;
      padding: 22px;
      color: white;
      max-width: 760px;
      width: 100%;
    }
    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .tab-btn {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #3f3f3f;
      color: #f0f0f0;
      border-radius: 999px;
      padding: 5px 14px;
      transition: 0.18s ease;
    }
    .tab-btn:hover {
      background: #555555;
      border-color: rgba(255, 255, 255, 0.3);
    }
    .tab-btn.active {
      background: #efefef;
      color: #252525;
      border-color: transparent;
    }
    .category-title {
      margin-bottom: 12px;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .sites-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      text-align: left;
    }
    .site-btn {
      width: 100%;
      color: #ffffff;
      border: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .site-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
      color: #ffffff;
    }
    .site-btn[data-cat="TC2"] {
      background: #4c3863;
    }
    .site-btn[data-cat="TF2"] {
      background: #ae5d30;
    }
    .site-btn[data-cat="Roblox"] {
      background: #2563eb;
    }
    .site-btn[data-cat="Other"] {
      background: #64748b;
    }
    .site-btn[data-cat="External"] {
      background: #d97706;
    }
    @media (max-width: 680px) {
      .sites-grid {
        grid-template-columns: 1fr;
      }
    }
    footer {
      margin-top: 20px;
      font-size: 1rem;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <h1 class="mb-4">Rock's Websites</h1>
  <div class="container">
    <div id="sites">
      Loading sites...
    </div>
  </div>
  <footer>
    Welcome, this is a website I made for hosting my HTML projects that I sometimes work on (mostly for a Roblox game called Typical Colors 2). Enjoy!
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
    (function () {
      const categoryOrder = ["TC2", "TF2", "Roblox", "Other", "External"];
      const categoryLabels = {
        TC2: "Typical Colors 2",
        TF2: "Team Fortress 2",
        Roblox: "Roblox Tools",
        Other: "Other Projects",
        External: "External Links"
      };
      const categoryButtonClasses = {
        TC2: "TC2",
        TF2: "TF2",
        Roblox: "Roblox",
        Other: "Other",
        External: "External"
      };

      function createButton(site) {
        const a = document.createElement("a");
        a.href = site.path;
        a.textContent = site.name;
        a.className = "btn site-btn";
        a.dataset.cat = categoryButtonClasses[site.category] || "Other";

        if (site.category === "External" || site.external) {
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        }
        return a;
      }

      function renderSites(sites) {
        const container = document.getElementById("sites");
        if (!container) return;

        container.innerHTML = "";

        const grouped = sites.reduce((acc, site) => {
          const cat = site.category || "Other";
          if (!acc[cat]) acc[cat] = [];
          acc[cat].push(site);
          return acc;
        }, {});

        const availableCategories = categoryOrder.filter((cat) => (grouped[cat] || []).length);
        const tabs = document.createElement("div");
        tabs.className = "category-tabs";

        const title = document.createElement("div");
        title.className = "category-title";

        const grid = document.createElement("div");
        grid.className = "sites-grid";

        function setCategory(cat) {
          title.textContent = categoryLabels[cat] || cat;
          grid.innerHTML = "";
          grouped[cat].forEach((site) => {
            grid.appendChild(createButton(site));
          });
          tabs.querySelectorAll(".tab-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.category === cat);
          });
        }

        availableCategories.forEach((cat) => {
          const tab = document.createElement("button");
          tab.type = "button";
          tab.className = "tab-btn";
          tab.dataset.category = cat;
          tab.textContent = categoryLabels[cat] || cat;
          tab.addEventListener("click", () => setCategory(cat));
          tabs.appendChild(tab);
        });

        container.appendChild(tabs);
        container.appendChild(title);
        container.appendChild(grid);

        if (availableCategories.length) {
          setCategory(availableCategories[0]);
        }
      }

      fetch("sites.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Failed to load sites.json");
          }
          return response.json();
        })
        .then((sites) => {
          if (!Array.isArray(sites)) {
            throw new Error("sites.json is not an array");
          }
          renderSites(sites);
        })
        .catch((error) => {
          const container = document.getElementById("sites");
          if (container) {
            container.textContent = "Unable to load sites list.";
            console.error(error);
          }
        });
    })();
  </script>
</body>
</html>
