<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TC2 Bingo Generator</title>
  <meta name="description" content="A bingo card generator for the Roblox game 'Typical Colors 2'.">
  <meta property="og:title" content="TC2 Bingo Card Generator">
  <meta property="og:description" content="A bingo card generator for the Roblox game 'Typical Colors 2'.">
  <meta property="og:url" content="https://rhgx.github.io/tc2-bingo/">
  <meta property="og:image" content="https://rhgx.github.io/tc2-bingo/og-image.png">
  <meta name="theme-color" content="#2c2d39">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script defer src="/others/tc2-grid.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1 class="game-text">TC2 Bingo Generator</h1>
      <p class="wins"><span class="game-text">Wins</span> <span id="win-counter" class="stat-value">0</span></p>
      <button type="button" id="new-card" class="connect-button"><span class="game-text">New Card</span></button>
    </header>

    <section class="panel">
      <canvas class="grid-background" id="grid-background" aria-hidden="true"></canvas>
      <div id="bingo-card" class="bingo-card" aria-label="Bingo card"></div>

      <!-- Styled after the in-game "You have found an item!" drop. -->
      <div id="overlay" class="overlay" hidden>
        <div class="drop" role="dialog" aria-modal="true" aria-labelledby="win-title">
          <h2 id="win-title" class="drop-title">You got a Bingo!</h2>
          <div class="drop-divider"></div>
          <button type="button" id="replay-button" class="connect-button"><span class="game-text">Replay</span></button>
        </div>
      </div>
    </section>

    <footer class="credits">
      <a href="/">
        <img src="/avatar.png" alt="" width="20" height="20">
        Made by Rocks
      </a>
    </footer>
  </main>
</body>
</html>
