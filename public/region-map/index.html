<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roblox Region Map</title>
  <meta name="description" content="Find the Roblox server regions closest to you.">
  <meta property="og:title" content="Roblox Region Map">
  <meta property="og:description" content="Find the Roblox server regions closest to you.">
  <meta property="og:url" content="https://rhgx.github.io/region-map/">
  <meta property="og:image" content="https://rhgx.github.io/logo.png">
  <meta name="theme-color" content="#0d0f11">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">

  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <h1>Roblox Region Map</h1>

      <div class="controls">
        <button type="button" id="locate" class="btn">
          <!-- Lucide "locate-fixed" (ISC License) -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/>
            <line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/>
            <circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/>
          </svg>
          Use my location
        </button>
        <div class="seg" role="group" aria-label="Distance unit">
          <button type="button" data-unit="km">km</button>
          <button type="button" data-unit="mi">mi</button>
        </div>
      </div>
      <p id="status" class="status" role="status" hidden></p>

      <label class="check" title="Reserve servers Roblox uses when a main region is full">
        <input type="checkbox" id="overflow"> Overflow regions
      </label>

      <ol id="regions" class="regions"></ol>

      <footer class="credits">
        <a href="https://github.com/Rhgx" target="_blank" rel="noopener noreferrer">
          <img src="/logo.svg" alt="" width="18" height="18">
          Made by Rocks
        </a>
      </footer>
    </aside>

    <main id="map" class="map" aria-label="Map of Roblox server regions"></main>
  </div>
</body>
</html>
