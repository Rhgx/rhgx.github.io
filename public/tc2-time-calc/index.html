<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TC2 Time Calculator</title>
  <meta name="description" content="A total time calculator for the Roblox game 'Typical Colors 2'.">
  <meta property="og:title" content="TC2 Time Calculator">
  <meta property="og:description" content="A total time calculator for the Roblox game 'Typical Colors 2'.">
  <meta property="og:url" content="https://rhgx.github.io/tc2-time-calc/">
  <meta property="og:image" content="https://rhgx.github.io/tc2-time-calc/assets/images/og-image.png">
  <meta name="theme-color" content="#2c2d39">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1 class="game-text">TC2 Time Calculator</h1>
      <button type="button" id="calculate" class="connect-button"><span class="game-text">Calculate</span></button>
    </header>

    <section class="panel">
      <canvas class="grid-background" id="grid-background" aria-hidden="true"></canvas>
      <div class="panel-body">
        <div class="servers" role="group" aria-label="Server type">
          <button type="button" class="side-button" data-server="official" aria-pressed="true"><span class="game-text">Official Servers</span></button>
          <button type="button" class="side-button" data-server="community" aria-pressed="false"><span class="game-text">Community Servers</span></button>
        </div>
        <div class="classes">
          <div class="class-grid" id="official"></div>
          <div class="class-grid" id="community" hidden></div>
        </div>
      </div>

      <section class="results" id="results" hidden>
        <dl class="totals" aria-live="polite" aria-atomic="true">
          <div>
            <dt class="game-text">Time Played</dt>
            <dd id="total-hours" class="stat-value"></dd>
          </div>
          <div id="total-days-row" hidden>
            <dt class="game-text">In Days</dt>
            <dd id="total-days" class="stat-value"></dd>
          </div>
        </dl>
        <ol id="bars" class="bars" aria-label="Time per class"></ol>
      </section>
    </section>

    <footer class="credits">
      <a href="/">
        <img src="/avatar.png" alt="" width="20" height="20">
        Made by Rocks
      </a>
    </footer>
  </main>
</body>
</html>
