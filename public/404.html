<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Rocks</title>
  <meta name="theme-color" content="#f59e0b">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <script>
    // Projects that moved to the Rhgx/archives repository keep their old links working.
    // Keep in sync with `archived` in src/data/projects.ts.
    (function () {
      var moved = [
        'tf2-data-visualizer-v1', 'video-to-atlas', 'slider', 'krabs-countdown', 'gag-countdown',
        'tc2-comp-hub', 'turkey-earthquake-map', 'tc2-xp-calc', 'tc2-puzzle', 'tc2-server-browser',
        'rocks-item-shop'
      ];
      var parts = location.pathname.split('/');
      if (moved.indexOf(parts[1]) !== -1) {
        location.replace('/archives' + location.pathname + location.search + location.hash);
      }
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #131518;
      color: #e6e8eb;
      font: 14px/1.5 system-ui, sans-serif;
    }
    main { padding: 24px; text-align: center; }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; color: #f59e0b; }
    p { margin: 0 0 16px; color: #8f97a1; }
    a {
      color: #e6e8eb;
      text-decoration: none;
      border: 1px solid #2a2e34;
      border-radius: 6px;
      padding: 6px 12px;
      margin: 0 4px;
    }
    a:hover { border-color: #3d434b; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>This page does not exist, or it may have moved.</p>
    <a href="/">All projects</a>
    <a href="/archives/">Archive</a>
  </main>
</body>
</html>
